spring.application.name=autoloc-api


# Port du serveur
server.port=8004

# Configuration DataSource
# Note : 'root' est generalement l'utilisateur par defaut sous XAMPP/Wamp/Docker meme sans mot de passe
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuration JPA / Hibernate
# 'update' met a jour le schema sans detruire les donnees existantes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect